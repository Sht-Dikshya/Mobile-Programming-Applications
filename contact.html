<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Form</title>
  <style>
    /* Internal CSS for form styling */
    form {
      width: 300px;
      margin: 20px auto;
      padding: 15px;
      border: 2px solid #333;
      border-radius: 5px;
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 3px;
      box-sizing: border-box;
      font-size: 14px;
    }

    input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }

    input[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <form action="/submit" method="post" enctype="application/x-www-form-urlencoded">
    <!-- Form element starts -->
    
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your name" required style="border-color: blue;" />
    <!-- input element with type, id, name, placeholder, required attributes -->

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Your email" required/>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="Your phone number" pattern="[0-9]{10}" title="Enter 10 digit phone number" />
    <!-- pattern attribute limits input -->

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4" placeholder="Write your message here" required></textarea>

    <input type="submit" value="Send Message" />
  </form>

</body>
</html>
